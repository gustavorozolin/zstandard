name: PR Check Windows

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.47.2' }}

jobs:
  check_windows_analyze:
    name: Analyze Windows
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flutter SDK
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_windows
        shell: cmd
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_windows
        shell: cmd
        run: flutter analyze

  check_windows_test:
    name: Test Windows
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flutter SDK
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_windows
        shell: cmd
        run: flutter pub get

      - name: Clean example
        working-directory: zstandard_windows/example
        shell: cmd
        run: flutter clean

      - name: Get example dependencies
        working-directory: zstandard_windows/example
        shell: cmd
        run: flutter pub get

      - name: Run integration tests
        working-directory: zstandard_windows/example
        shell: cmd
        run: flutter test integration_test/ -d windows

      - name: Diagnose native test build after failure
        if: failure()
        working-directory: zstandard_windows/example
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = 'build/windows/x64/CMakeCache.txt'
          if (-not (Test-Path -LiteralPath $cache)) {
            Write-Host 'No configured native build is available for diagnosis.'
            exit 0
          }
          $commands = @(Get-Content -LiteralPath $cache | Where-Object { $_.StartsWith('CMAKE_COMMAND:INTERNAL=') })
          if ($commands.Count -ne 1) { throw 'Native CMake command is ambiguous.' }
          $cmake = $commands[0].Split('=', 2)[1]
          & $cmake --build build/windows/x64 --config Debug --target zstandard_windows_test --verbose
          exit $LASTEXITCODE

  check_windows_test_from_pub_cache:
    name: Test Windows (from pub cache)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flutter SDK
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Remove zstandard_native to force resolution from pub cache
        shell: cmd
        run: rmdir /s /q zstandard_native

      - name: Clean and get dependencies (force pub cache)
        working-directory: zstandard_windows
        shell: cmd
        run: flutter clean && flutter pub get

      - name: Get dependencies in example (force pub cache)
        working-directory: zstandard_windows/example
        shell: cmd
        run: flutter clean && flutter pub get

      - name: Run integration tests (C sources from pub cache)
        working-directory: zstandard_windows/example
        shell: cmd
        run: flutter test integration_test/ -d windows

      - name: Diagnose native test build after failure
        if: failure()
        working-directory: zstandard_windows/example
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = 'build/windows/x64/CMakeCache.txt'
          if (-not (Test-Path -LiteralPath $cache)) {
            Write-Host 'No configured native build is available for diagnosis.'
            exit 0
          }
          $commands = @(Get-Content -LiteralPath $cache | Where-Object { $_.StartsWith('CMAKE_COMMAND:INTERNAL=') })
          if ($commands.Count -ne 1) { throw 'Native CMake command is ambiguous.' }
          $cmake = $commands[0].Split('=', 2)[1]
          & $cmake --build build/windows/x64 --config Debug --target zstandard_windows_test --verbose
          exit $LASTEXITCODE

  check_windows_publish_dry_run:
    name: Dry Run Publish Windows
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flutter SDK
        uses: ./.github/actions/setup-flutter-windows
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get dependencies
        working-directory: zstandard_windows
        shell: cmd
        run: flutter pub get

      - name: Publish Dry Run
        working-directory: zstandard_windows
        shell: cmd
        run: dart pub publish --dry-run
