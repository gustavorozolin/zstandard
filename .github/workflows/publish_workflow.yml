name: Publish Tagged Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: zstandard-release-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

env:
  FLUTTER_VERSION: '3.47.2'
  MAIN_BRANCH: ${{ vars.MAIN_BRANCH || 'master' }}
  RELEASE_TREE: ${{ vars.RELEASE_TREE || 'release' }}

jobs:
  validate_tag:
    name: Validate immutable release tag
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 20
    outputs:
      version: ${{ steps.context.outputs.version }}
      commit: ${{ steps.context.outputs.commit }}
      kind: ${{ steps.context.outputs.kind }}
      issue: ${{ steps.candidate.outputs.issue }}
      operation-id: ${{ steps.candidate.outputs.operation-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify tag provenance and publication lane
        id: context
        env:
          HOTFIX_TREE: ${{ vars.HOTFIX_TREE || 'hotfix' }}
        run: bash scripts/check_release_tag.sh

      - name: Require successful preparation and accepted Copilot promotion
        if: steps.context.outputs.kind == 'release'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.context.outputs.version }}
          SOURCE_SHA: ${{ steps.context.outputs.source-commit }}
          PRODUCTION_SHA: ${{ steps.context.outputs.commit }}
        run: python3 scripts/release_candidate.py verify "$VERSION" "$SOURCE_SHA" "$PRODUCTION_SHA"

      - name: Validate package metadata and generated artifacts
        if: steps.context.outputs.kind == 'release'
        env:
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          dart scripts/check_pub_metadata.dart --release-version "$version"
          git diff --check
          for artifact in \
            zstandard_cli/lib/src/bin/libzstandard_macos.dylib \
            zstandard_cli/lib/src/bin/libzstandard_linux_x64.so \
            zstandard_cli/lib/src/bin/libzstandard_linux_arm64.so \
            zstandard_cli/lib/src/bin/zstandard_windows_x64.dll \
            zstandard_cli/lib/src/bin/zstandard_windows_arm64.dll \
            zstandard_web/blob/zstd.js \
            zstandard_web/blob/zstd_core.js \
            zstandard_web/blob/zstd_worker.js \
            zstandard_web/blob/zstd.wasm; do
            test -s "$artifact"
          done
          cmp zstandard_web/blob/zstd.js zstandard_web/example/web/zstd.js
          cmp zstandard_web/blob/zstd.js zstandard/example/web/zstd.js
          cmp zstandard_web/blob/zstd_core.js zstandard_web/example/web/zstd_core.js
          cmp zstandard_web/blob/zstd_core.js zstandard/example/web/zstd_core.js
          cmp zstandard_web/blob/zstd_worker.js zstandard_web/example/web/zstd_worker.js
          cmp zstandard_web/blob/zstd_worker.js zstandard/example/web/zstd_worker.js
          cmp zstandard_web/blob/zstd.wasm zstandard_web/example/web/zstd.wasm
          cmp zstandard_web/blob/zstd.wasm zstandard/example/web/zstd.wasm

  publish:
    name: Publish packages to pub.dev with OIDC
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 180
    needs: [validate_tag]
    if: needs.validate_tag.outputs.kind == 'release'
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate_tag.outputs.commit }}
          fetch-depth: 0

      # setup-dart provisions the short-lived pub.dev credential from GitHub's
      # OIDC token. Flutter is installed afterwards so its bundled Dart stays
      # first on PATH while using the same Pub credentials.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Publish in dependency order, safely skipping immutable versions
        env:
          VERSION: ${{ needs.validate_tag.outputs.version }}
        run: |
          set -euo pipefail
          publish_and_wait() {
            local package="$1"
            if [[ "$package" == zstandard_native || "$package" == zstandard_cli ]]; then
              (cd "$package" && dart pub get)
            else
              (cd "$package" && flutter pub get)
            fi
            dart run scripts/publish_if_missing.dart "$package" "$VERSION"
            dart run scripts/wait_for_pub_version.dart "$package" "$VERSION" 1200
          }

          publish_and_wait zstandard_platform_interface
          publish_and_wait zstandard_native
          for package in \
            zstandard_android zstandard_ios zstandard_linux zstandard_macos \
            zstandard_web zstandard_windows; do
            publish_and_wait "$package"
          done
          publish_and_wait zstandard_cli
          publish_and_wait zstandard

  verify:
    name: Verify all published packages
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 30
    needs: [validate_tag, publish]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate_tag.outputs.commit }}

      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify exact versions through the public API
        env:
          VERSION: ${{ needs.validate_tag.outputs.version }}
        run: |
          set -euo pipefail
          for package in \
            zstandard_platform_interface zstandard_native zstandard_android \
            zstandard_ios zstandard_linux zstandard_macos zstandard_web \
            zstandard_windows zstandard_cli zstandard; do
            dart run scripts/wait_for_pub_version.dart "$package" "$VERSION" 1200
          done

  github_release:
    name: Confirm publication through Copilot
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 15
    needs: [validate_tag, verify]
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: copilot-deployment-${{ github.repository_id }}-${{ needs.validate_tag.outputs.issue }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate_tag.outputs.commit }}

      - name: Build native-library checksum manifest
        run: |
          set -euo pipefail
          {
            echo "Native CLI library checksums for $GITHUB_REF_NAME"
            sha256sum zstandard_cli/lib/src/bin/*
            sha256sum zstandard_web/blob/zstd.js zstandard_web/blob/zstd_core.js \
              zstandard_web/blob/zstd_worker.js zstandard_web/blob/zstd.wasm
          } > checksums.txt

      - name: Create or verify accepted GitHub Release
        uses: vypdev/copilot@v3
        with:
          single-action: create_release
          single-action-issue: ${{ needs.validate_tag.outputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-operation-id: ${{ needs.validate_tag.outputs.operation-id }}
          single-action-version: ${{ needs.validate_tag.outputs.version }}
          token: ${{ secrets.PAT }}

      - name: Attach checksums to the verified release
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" checksums.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Confirm publication and start configured reconciliation
        uses: vypdev/copilot@v3
        with:
          single-action: published_deployment_action
          single-action-issue: ${{ needs.validate_tag.outputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-operation-id: ${{ needs.validate_tag.outputs.operation-id }}
          single-action-version: ${{ needs.validate_tag.outputs.version }}
          merge-queue-check-attestations: ${{ vars.MERGE_QUEUE_CHECK_ATTESTATIONS || '[]' }}
          token: ${{ secrets.PAT }}

  report_failure:
    name: Record package publication failure
    needs: [validate_tag, publish, verify, github_release]
    if: ${{ failure() && needs.validate_tag.outputs.kind == 'release' && needs.validate_tag.outputs.issue != '' }}
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 5
    concurrency:
      group: copilot-deployment-${{ github.repository_id }}-${{ needs.validate_tag.outputs.issue }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.validate_tag.outputs.commit }}
          persist-credentials: false
      - uses: vypdev/copilot@v3
        with:
          single-action: failed_deployment_action
          single-action-issue: ${{ needs.validate_tag.outputs.issue }}
          issue-workflow-profile: ${{ vars.COPILOT_ISSUE_WORKFLOW_PROFILE || '' }}
          single-action-operation-id: ${{ needs.validate_tag.outputs.operation-id }}
          single-action-version: ${{ needs.validate_tag.outputs.version }}
          single-action-message: Package publication failed. Review ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} and rerun this immutable tag workflow.
          token: ${{ secrets.PAT }}
