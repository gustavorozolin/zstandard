name: iOS simulator contract
on:
  pull_request:
    paths:
      - '.github/scripts/start_ios_simulator.py'
      - '.github/scripts/tests/test_ios_simulator.py'
      - '.github/scripts/tests/test_ios_flutter.py'
      - '.github/scripts/prepare_ios_flutter.sh'
      - '.github/patches/flutter-ios-log-readiness.patch'
      - '.github/workflows/pr_check_ios.yml'
      - '.github/workflows/simulator_contract.yml'
jobs:
  simulator-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s .github/scripts/tests -p test_ios_simulator.py -v
      - run: python -m unittest discover -s .github/scripts/tests -p test_ios_flutter.py -v
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.47.2'
      - name: Prepare the exact SDK backport without changing the shared SDK
        timeout-minutes: 10
        run: bash .github/scripts/prepare_ios_flutter.sh
      - name: Verify upstream delayed-log-stream startup regressions
        timeout-minutes: 10
        working-directory: ${{ env.FLUTTER_ROOT }}/packages/flutter_tools
        run: ../../bin/dart test test/general.shard/ios/simulators_test.dart --name 'waiting for the log stream'
      - name: Remove this job's patched Flutter SDK
        if: ${{ always() && env.ZSTANDARD_IOS_FLUTTER_DIR != '' }}
        timeout-minutes: 3
        run: bash .github/scripts/prepare_ios_flutter.sh --cleanup
