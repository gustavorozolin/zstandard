# Project-owned dependency setup, executed by Copilot's existing coordinator.
name: Prepare project verification
description: Provision the tested Flutter/Dart SDK before project verification.
runs:
  using: composite
  steps:
    - name: Install the tested Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.47.2'
        architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
        cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'
        cache: false
        pub-cache: false
    - name: Verify the provisioned SDK
      shell: bash
      run: |
        set -euo pipefail
        flutter --version
        dart --version
